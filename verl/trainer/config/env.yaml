env:
  env_name: alfworld/AlfredTWEnv
  seed: 0
  max_steps: 50
  history_length: 2
  resources_per_worker: # resources for each env worker
    num_cpus: 0.1
    num_gpus: 0
  rollout:
    n: -1 # the group number of envs (for GRPO and GiGPO). -1 means disable env grouping.

  sokoban:
    dim_room: [6, 6]
    num_boxes: 1
    search_depth: 30
    mode: tiny_rgb_array
  webshop:
    use_small: True
    human_goals: False